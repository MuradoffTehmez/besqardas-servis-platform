name: Funksiya və ya texniki iş
description: PRD-yə bağlı ayrıca iş vahidi
title: "feat: "
body:
  - type: input
    id: prd
    attributes:
      label: PRD bölməsi və prioritet
      placeholder: "§13, MVP"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Məqsəd və əhatə
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Qəbul meyarları
      description: Yoxlanıla bilən nəticələri checklist şəklində yazın.
    validations:
      required: true
